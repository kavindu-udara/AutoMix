services:
  redis:
    image: redis:7
    container_name: automix-redis
    ports:
      - "6379:6379"
      
  postgres:
    image: postgres:15-alpine
    container_name: automix-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: automix
    ports:
      - "5432:5432"